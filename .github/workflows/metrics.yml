name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: adityaa6060
          filename: github-metrics.svg

          # Remove every base section
          base: ""

          # Calendar only
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Disable everything else
          plugin_languages: no
          plugin_followup: no
          plugin_habits: no
          plugin_activity: no
          plugin_topics: no
          plugin_lines: no
          plugin_repositories: no
          plugin_traffic: no
          plugin_stars: no
          plugin_achievements: no
          plugin_notable: no
          plugin_people: no
          plugin_gists: no
          plugin_introduction: no

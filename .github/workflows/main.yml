name: generate arcade contribution graphs

on:
  schedule: # Run automatically every 24 hours
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual triggering from the Actions tab
  push: # Runs on every push to the main branch
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          # Comma-separated list of games to generate — pacman is the classic pick
          games: 'pacman'

      # Push the generated SVGs to the "output" branch, which the README reads from
      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Self-hosted replacement for the streak-stats.demolab.com and
  # github-profile-trophy widgets, both of which run on free, unreliable
  # third-party servers. This job renders the equivalents directly with
  # GitHub Actions and commits the SVG straight into this repo (main
  # branch), so nothing external has to be "up" for it to show.
  metrics:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: github-metrics.svg
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_achievements: yes
          plugin_achievements_threshold: C
